[project]
name = "agentinvest"
version = "0.1.0"
description = "Multi-agent equity research system producing auditable, evidence-linked reports."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["backend", "tests", "scripts"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# WHY: CLAUDE.md §16 requires `mypy --strict` on backend/calc/ and backend/evidence/
# specifically. Neither package exists yet (Phase 6 and Phase 2 respectively), so the
# settings above are a clean, honest, non-strict baseline for backend/core in the
# meantime. When calc/ and evidence/ land, add an override block, e.g.:
#
# [[tool.mypy.overrides]]
# module = ["backend.calc.*", "backend.evidence.*"]
# strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
